readme = "README.md"
authors = [
    { name = "ferozeren", email = "ferozeren@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
