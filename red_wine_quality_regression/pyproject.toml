[project]
name = "red-wine-quality-regression"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ferozeren", email = "ferozeren@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
red-wine-quality-regression = "red_wine_quality_regression:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
